    # Flask 入门指南 🌶️

    Flask 是一个轻量级的 Python Web 框架，上手简单，扩展性极强。

    ## 安装

    ```bash
    pip install flask
    ```

    ## Hello World

    ```python
    from flask import Flask
    app = Flask(__name__)

    @app.route('/')
    def index():
        return 'Hello, Flask!'

    app.run(debug=True)
    ```

    打开浏览器访问 `http://localhost:5000`，就可以看到你的第一个 Flask 应用啦！

    ## 核心概念

    1. **路由（Route）**：通过 `@app.route` 绑定 URL 与函数
    2. **模板（Template）**：Jinja2 渲染 HTML
    3. **请求与响应**：Request / Response 对象
    4. **会话**：Session 保持用户状态

    > 更多内容请参考官方文档 📚


{% extends 'base.html' %}

{% block title %}404 - 页面不存在{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-16 fade-in">
    <div class="text-9xl font-black bg-gradient-to-r from-blue-500 to-purple-600 bg-clip-text text-transparent mb-6">404</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-3">页面走丢了 😢</h1>
    <p class="text-gray-500 mb-8">您访问的页面不存在，或者已经被删除。</p>
    <a href="{{ url_for('index') }}"
       class="inline-block px-6 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-medium shadow-lg transition">
        ← 返回首页
    </a>
</div>
{% endblock %}
